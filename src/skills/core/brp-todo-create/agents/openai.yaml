interface:
  display_name: BRP Todo Create
  short_description: Build a project backlog and work log from accessible agent conversation history.
  default_prompt:
    Audit the accessible project history and consolidate every recoverable task into TODO.md,
    TODO_LOG.md, and TODO_HISTORY_INDEX.jsonl without implementing the work.
  brand_color: '#0F766E'
policy:
  allow_implicit_invocation: true
busirocket:
  skill_class: workflow
  requires_references: true
  failure_mode: Escalate to brp-todo-work once the backlog exists and the request turns into executing it.
